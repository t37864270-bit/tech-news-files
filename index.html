<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحضير الرابط - TECH NEWS</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #downloadBtn { display: none; background: #28a745; color: white; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; }
        #timer { font-size: 20px; color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>TECH NEWS ARABIC</h2>
    <p>يتم الآن فحص وتجهيز ملف القنوات...</p>
    <div id="loader" class="loader"></div>
    <p id="status">يرجى الانتظار <span id="timer">10</span> ثانية</p>
    <button id="downloadBtn" onclick="go()">إضغط للتحميل الآن</button>
</div>

<script>
    var seconds = 10;
    var timerDisplay = document.getElementById('timer');
    var loader = document.getElementById('loader');
    var statusText = document.getElementById('status');
    var btn = document.getElementById('downloadBtn');

    var countdown = setInterval(function() {
        seconds--;
        timerDisplay.textContent = seconds;
        if (seconds <= 0) {
            clearInterval(countdown);
            loader.style.display = 'none';
            statusText.textContent = "الرابط جاهز الآن!";
            btn.style.display = 'block';
        }
    }, 1000);

    function go() {
        // تشفير الرابط يدوياً لزيادة التمويه
        var a = "https://www.";
        var b = "effectivegatecpm";
        var c = ".com/rqh0w6f8?key=3cab13c99b3cd48b5084666edb512990";
        window.location.href = a + b + c;
    }
</script>

</body>
</html>
