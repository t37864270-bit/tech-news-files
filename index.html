<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECH NEWS ARABIC - التحميل الآمن</title>
    <style>
        body { font-family: sans-serif; background-color: #1a202c; color: white; text-align: center; padding: 50px; margin: 0; }
        .container { background: #2d3748; padding: 30px; border-radius: 20px; display: inline-block; max-width: 400px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .btn { background: #48bb78; color: white; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; text-decoration: none; display: inline-block; margin-top: 20px; width: 100%; }
        .msg { font-size: 14px; color: #a0aec0; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>TECH NEWS ARABIC</h2>
    <p>ملف قنوات Géant 2026</p>
    
    <button onclick="downloadNow()" class="btn">تحميل الملف (MediaFire)</button>
    
    <p class="msg">سيفتح الرابط في نافذة جديدة، إذا لم يبدأ التحميل اضغط مرة أخرى.</p>
</div>

<script>
function downloadNow() {
    // 1. رابط الإعلان (الذي يدر لك الربح)
    var adsLink = "https://www.effectivegatecpm.com/k6v160jx?key=ad44a964c0d2e6e399494428af0aa601";
    
    // 2. رابط الملف الحقيقي (مثلاً ميديا فاير أو أي رابط تحميل)
    var fileLink = "https://www.mediafire.com"; // استبدله برابط ملفك لاحقاً

    // الخدعة: نفتح الإعلان في نافذة جديدة
    window.open(adsLink, '_blank');
    
    // ثم نوجه الصفحة الحالية للملف الحقيقي بعد ثانية واحدة
    setTimeout(function(){
        window.location.href = fileLink;
    }, 1000);
}
</script>

</body>
</html>
